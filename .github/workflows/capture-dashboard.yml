name: Capture Real Dashboard Screenshots
on:
  push:
    branches: [docs/real-app-screenshots-2026-11-13]
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Serve static application
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/dashboard-server.log 2>&1 &
      - name: Capture rendered charts
        run: node scripts/capture-dashboard.cjs
      - name: Commit genuine screenshots to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "docs: capture real dashboard views [skip ci]"
          git push origin HEAD:refs/heads/docs/real-app-screenshots-2026-11-13
